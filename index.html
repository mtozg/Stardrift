body,button{font-size-adjust:.5}

  :root{
    --ink:#03050c; --panel:#0e1527; --line:#26335a; --text:#e8edff; --dim:#8f9cc0;
    --amber:#ffb454; --ice:#7fd8ff; --rose:#ff6b8a; --ok:#7be0a4;
    /* STİL REHBERİ: tek yazı tipi (--font), ana vurgu amber, ikincil buz mavisi, tehlike gül kırmızısı, olumlu yeşil. Yeni arayüz bu değişkenlerden çıkmaz. */
    --disp:"Barlow","Segoe UI",system-ui,sans-serif;
    --font:"Barlow","Segoe UI",system-ui,sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:var(--font)}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;
    font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform:translateZ(0)}
  canvas#gl,canvas#hud{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  canvas#hud{z-index:1;pointer-events:none}
  #zone{position:fixed;inset:0;z-index:2}
  .hidden{display:none !important}

  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:4;
    background:rgba(14,21,39,.92);border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-size:14px;
    max-width:80vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}
  #radio{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:3;pointer-events:none;font-size:12px;max-width:46vw;display:flex;flex-direction:column;gap:3px}
  #radio .rl{background:rgba(6,14,26,.62);border-left:2px solid var(--ice);padding:3px 8px;border-radius:3px;animation:rl 8s forwards}
  @keyframes rl{0%{opacity:0;transform:translateX(-8px)}5%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
  #hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px + 6vh);z-index:3;
    font-size:12px;color:var(--dim);pointer-events:none;text-align:center;max-width:70vw;transition:opacity 1s}

  .btn{position:fixed;z-index:4;border:1px solid var(--line);background:rgba(14,21,39,.8);color:var(--text);
    border-radius:50%;font:600 14px/1.2 var(--font);display:flex;align-items:center;justify-content:center;
    touch-action:none;backdrop-filter:blur(4px)}
  .btn:active,.btn.down,.btn.on{background:rgba(255,180,84,.28);border-color:var(--amber)}
  #bLaser{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:88px;height:88px;font-size:16px;border-color:var(--rose)}
  #bLaser.down{background:rgba(255,107,138,.3)}
  #bThrust{right:calc(env(safe-area-inset-right,0px) + 114px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:64px;height:64px}
  #bBrake{right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);width:60px;height:60px}
  #bBoost{right:calc(env(safe-area-inset-right,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:62px;height:62px;border-color:var(--ice);color:var(--ice);font-size:13px}
  #bBoost.down{background:rgba(127,216,255,.28)}
  #bLock{right:calc(env(safe-area-inset-right,0px) + 188px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:58px;height:58px;border-color:var(--amber);color:var(--amber);font-size:13px}
  #bLock.on{background:rgba(255,180,84,.3)}
  #bMissile{right:calc(env(safe-area-inset-right,0px) + 254px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:58px;height:58px;border-color:var(--rose);color:var(--rose);font-size:12px;text-align:center;line-height:1.1}
  #bDock{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 192px);height:46px;border-radius:23px;padding:0 18px;
    border-color:var(--ok);color:var(--ok);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(123,224,164,.12)}}
  @media (prefers-reduced-motion:reduce){#bDock{animation:none}}
  #snd{right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 6vh);width:40px;height:40px;font-size:12px;z-index:4}

  #stage .btn.img{background-color:transparent;background-image:var(--bi);background-size:100% 100%;background-repeat:no-repeat;border:0;backdrop-filter:none;
    align-items:flex-end;padding-bottom:3px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 4px #000;text-align:center;line-height:1.05;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  #stage .btn.img:active,#stage .btn.img.down,#stage .btn.img.on{background-color:transparent;background-image:var(--bi);filter:brightness(1.5) drop-shadow(0 0 8px rgba(255,200,120,.8))}
  #stage #bDock.img{width:76px;height:76px;border-radius:50%;padding:0 4px 4px;border:0;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 188px)}
  #stickBase,#stickKnob{position:fixed;z-index:3;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
  #stickBase{width:120px;height:120px;border:1px solid var(--line);background:rgba(14,21,39,.3)}
  #stickKnob{width:50px;height:50px;background:rgba(255,180,84,.35);border:1px solid var(--amber)}

  #dock{position:fixed;inset:0;z-index:6;background:linear-gradient(rgba(3,5,12,.3),rgba(3,5,12,.7)),var(--hg,none) center/cover #03050c;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
  #dock .card{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;touch-action:pan-y}
  #dock h2{margin:0 0 2px;font-size:20px}
  #dock .sub{margin:0 0 14px;color:var(--dim);font-size:14px}
  .line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #18213b;font-size:15px;gap:10px}
  .line:last-child{border-bottom:0}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
  .dim{color:var(--dim);font-size:13px}
  button.act{font:600 15px/1.2 var(--font);border-radius:10px;border:1px solid var(--amber);background:rgba(255,180,84,.14);color:var(--text);padding:10px 14px;touch-action:manipulation;white-space:nowrap}
  button.act:disabled{opacity:.4;border-color:var(--line)}
  button.act.full{width:100%;margin-top:10px}
  button.go{border-color:var(--ok);background:rgba(123,224,164,.14)}
  .sect{margin:16px 0 4px;font-size:15px;color:var(--amber);font-weight:700}
  #rotate{position:fixed;inset:0;z-index:2147483000;background:radial-gradient(ellipse at 50% 40%,#0e1a38,#03050c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;touch-action:none}
  #rotate h2{margin:6px 0 0;font-size:24px}
  #rotate p{margin:0;color:var(--dim);font-size:15px;max-width:300px;line-height:1.45}
  #rotate p.sm{font-size:13px;opacity:.8;margin-top:6px}
  #rotate .ph{width:62px;height:108px;border:3px solid var(--amber);border-radius:12px;position:relative;animation:rot 2.6s ease-in-out infinite;box-shadow:0 0 24px rgba(255,180,84,.25)}
  #rotate .ph::after{content:"";position:absolute;left:50%;bottom:7px;width:20px;height:3px;margin-left:-10px;border-radius:2px;background:var(--amber)}
  @keyframes rot{0%,15%{transform:rotate(0deg)}55%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="stage">
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="zone"></div>
<div id="toast"></div>
<div id="radio"></div>
<div id="hint"></div>
<div id="stickBase" class="hidden"></div><div id="stickKnob" class="hidden"></div>

<div id="bBrake" class="btn">Fren</div>
<div id="bBoost" class="btn">Hızlan</div>
<div id="bLock" class="btn">Kilit</div>
<div id="bMissile" class="btn">Roket</div>
<div id="bThrust" class="btn">İtiş</div>
<div id="bLaser" class="btn">Lazer</div>
<div id="bDock" class="btn hidden">Üsse kenetlen</div>
<div id="snd" class="btn">Ses</div>

<div id="dock" class="hidden">
  <div class="card">
    <h2 id="dockTitle">Ankora İstasyonu</h2>
    <p class="sub">Kargonu sat, gemini geliştir.</p>
    <div id="cargoList"></div>
    <button class="act full go" id="sellAll">Hepsini sat</button>
    <div class="sect">Mühimmat</div>
    <div id="ammoRow"></div>
    <div class="sect">Gemi geliştirme</div>
    <div id="upgrades"></div>
    <button class="act full" id="undock">Kalkış</button>
  </div>
</div>

<div id="rotate" class="hidden"><div class="ph"></div><h2>Cihazı yan çevir</h2><p>Bu oyun yatay ekranda oynanır. Cihazı yan çevirince devam eder.</p></div>
</div>
<script src="vendor/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>

/* SÜRÜM: her güncellemede bu numarayı artır. Tarayıcı eski game.js dosyasını önbellekten getirmez,
   ayarlar panelinin altında da bu numara görünür. */
window.SD_VERSION = '1.34.3';
document.write('<script src="vendor/three-bloom.js?v=' + window.SD_VERSION + '"><\/script>');
document.write('<script src="js/game.js?v=' + window.SD_VERSION + '"><\/script>');
</script>
</body>
