name: Asset Factory - Asteroid Weathered Sculpt R010 r010
on:
  push:
    branches: [asset-factory/asteroid-v1-blender]
    paths:
      - .github/workflows/asset-factory-asteroid.yml
      - tools/asset_factory/generators/asteroid_crystal.py
      - tools/asset_factory/generators/render_asteroid_preview.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-asteroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 xvfb
      - name: Generate fused rock masses
        run: |
          mkdir -p build/asteroid
          blender --background --factory-startup --python tools/asset_factory/generators/asteroid_crystal.py
      - name: Render dense sculpt preview
        run: xvfb-run -a blender --background --python tools/asset_factory/generators/render_asteroid_preview.py
      - name: Validate and package
        run: |
          python3 - <<'PY'
          import json,os,struct
          glb='build/asteroid/sd_env_rock_variants_r010.glb'
          qc='build/asteroid/qc_report_r010.json'
          png='build/asteroid/asteroid_preview_r010.png'
          scene='build/asteroid/asteroid_scene_r010.blend'
          assert all(os.path.isfile(x) for x in (glb,qc,png,scene))
          with open(glb,'rb') as f: magic,version,length=struct.unpack('<4sII',f.read(12))
          assert magic==b'glTF' and version==2 and length==os.path.getsize(glb)
          report=json.load(open(qc))
          assert report['glb_header_valid'] and len(report['variants'])==3
          assert all(v['construction'].startswith('fused_irregular') or v['construction'].startswith('fused_') for v in report['variants'].values())
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardrift-env-rock-r010
          path: build/asteroid/
          if-no-files-found: error
