<script src="viewer.js"></script>
<script>
// Kullanım: check.html?cfg=<qc yapılandırma JSON yolu>  — Playwright (run_check.js) okur: window.__R
(async () => {
  try {
    const cfg = await (await fetch(new URLSearchParams(location.search).get('cfg'))).json();
    window.__R = await SDV.check(cfg);
  } catch (e) { window.__R = { error: String(e && e.stack || e), done: 1 }; }
})();
</script>
